services:
  - type: web
    name: picklebowl
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn Backend.wsgi:application
    healthCheckPath: /api/products/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CSRF_TRUSTED_ORIGINS
        value: https://picklebowl.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: picklebowl-db
          property: connectionString
databases:
  - name: picklebowl-db
    databaseName: picklebowl
    user: picklebowl
