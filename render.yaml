services:
  - type: web
    name: picklebowl
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: npm --prefix ../Frontend ci && npm --prefix ../Frontend run build && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn Backend.wsgi:application
    healthCheckPath: /api/products/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
