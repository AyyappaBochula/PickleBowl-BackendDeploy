{% extends 'adminpanel/base.html' %}

{% block title %}
Add Product
{% endblock %}

{% block active_products %}
active
{% endblock %}

{% block content %}

<style>

    .page-header{

        display:flex;

        justify-content:space-between;

        align-items:center;

        margin-bottom:30px;
    }

    .page-header h1{

        font-size:32px;

        color:#0f172a;
    }

    .back-btn{

        text-decoration:none;

        background:#e2e8f0;

        color:#0f172a;

        padding:12px 18px;

        border-radius:10px;

        font-weight:600;

        transition:0.3s;
    }

    .back-btn:hover{

        background:#cbd5e1;
    }

    .form-card{

        background:white;

        padding:35px;

        border-radius:22px;

        box-shadow:0 10px 30px rgba(0,0,0,0.08);

        max-width:900px;
    }

    .form-grid{

        display:grid;

        grid-template-columns:1fr 1fr;

        gap:22px;
    }

    .full-width{

        grid-column:1/3;
    }

    .input-group{

        display:flex;

        flex-direction:column;
    }

    .input-group label{

        margin-bottom:10px;

        color:#334155;

        font-weight:700;
    }

    .input-group input,
    .input-group textarea,
    .input-group select{

        width:100%;

        padding:14px;

        border:1px solid #cbd5e1;

        border-radius:12px;

        font-size:15px;

        transition:0.3s;

        background:white;
    }

    .input-group textarea{

        resize:none;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus{

        outline:none;

        border-color:#2563eb;

        box-shadow:0 0 0 4px rgba(37,99,235,0.15);
    }

    .upload-box{

        border:2px dashed #cbd5e1;

        background:#f8fafc;

        padding:25px;

        border-radius:14px;
    }

    .checkbox-wrapper{

        display:flex;

        gap:20px;

        flex-wrap:wrap;
    }

    .checkbox-box{

        flex:1;

        min-width:220px;

        display:flex;

        align-items:center;

        gap:12px;

        background:#f8fafc;

        border:1px solid #e2e8f0;

        padding:16px;

        border-radius:14px;
    }

    .checkbox-box input{

        width:20px;

        height:20px;
    }

    .checkbox-box span{

        font-weight:600;

        color:#334155;
    }

    .submit-btn{

        margin-top:30px;

        border:none;

        background:#2563eb;

        color:white;

        padding:15px 30px;

        border-radius:12px;

        font-size:16px;

        font-weight:700;

        cursor:pointer;

        transition:0.3s;
    }

    .submit-btn:hover{

        background:#1d4ed8;

        transform:translateY(-2px);
    }

    @media(max-width:768px){

        .form-grid{

            grid-template-columns:1fr;
        }

        .full-width{

            grid-column:auto;
        }

        .checkbox-wrapper{

            flex-direction:column;
        }
    }

</style>

<div class="page-header">

    <h1>
        Add Product
    </h1>

    <a
        href="/admin/products/"
        class="back-btn"
    >
        ← Back
    </a>

</div>

<div class="form-card">

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        <div class="form-grid">

            <div class="input-group">

                <label>
                    Category
                </label>

                <select
                    name="category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    {% for category in categories %}

                    <option value="{{ category.id }}">

                        {{ category.name }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="input-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Product Name"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Price Per KG
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="price"
                    placeholder="Enter Price"
                    required
                >

            </div>

            <div class="input-group">

                <label>
                    Product Rating
                </label>

                <input
                    type="number"
                    step="0.1"
                    name="rating"
                    placeholder="Enter Rating"
                    required
                >

            </div>

            <div class="input-group full-width">

                <label>
                    Product Description
                </label>

                <textarea
                    name="description"
                    rows="6"
                    placeholder="Write Product Description"
                ></textarea>

            </div>

            <div class="input-group full-width">

                <label>
                    Upload Product Image
                </label>

                <div class="upload-box">

                    <input
                        type="file"
                        name="image"
                        required
                    >

                </div>

            </div>

            <div class="full-width">

                <div class="checkbox-wrapper">

                    <div class="checkbox-box">

                        <input
                            type="checkbox"
                            name="is_popular"
                        >

                        <span>
                            Popular Product
                        </span>

                    </div>

                    <div class="checkbox-box">

                        <input
                            type="checkbox"
                            name="is_festival_offer"
                        >

                        <span>
                            Festival Product
                        </span>

                    </div>

                </div>

            </div>

        </div>

        <button
            type="submit"
            class="submit-btn"
        >
            Add Product
        </button>

    </form>

</div>

{% endblock %}
