<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PickleBowl Admin Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{

            font-family: Arial, Helvetica, sans-serif;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
            linear-gradient(
                135deg,
                #1e293b,
                #0f172a
            );
        }

        .login-container{

            width: 100%;
            max-width: 420px;

            padding: 20px;
        }

        .login-card{

            background: white;

            border-radius: 18px;

            padding: 40px 35px;

            box-shadow:
            0 10px 30px rgba(0,0,0,0.25);

            animation: fadeIn 0.5s ease;
        }

        .logo{

            text-align: center;

            margin-bottom: 25px;
        }

        .logo h1{

            color: #111827;

            font-size: 32px;

            margin-bottom: 8px;
        }

        .logo p{

            color: #64748b;

            font-size: 15px;
        }

        .input-group{

            margin-bottom: 20px;
        }

        .input-group label{

            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-weight: 600;
        }

        .input-group input{

            width: 100%;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 15px;

            transition: 0.3s;
        }

        .input-group input:focus{

            border-color: #2563eb;

            outline: none;

            box-shadow:
            0 0 0 4px rgba(37,99,235,0.15);
        }

        .login-btn{

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover{

            background: #1d4ed8;
        }

        .error-message{

            background: #fee2e2;

            color: #dc2626;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .footer{

            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 13px;
        }

        @keyframes fadeIn{

            from{
                opacity: 0;
                transform: translateY(20px);
            }

            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 500px){

            .login-card{
                padding: 30px 25px;
            }

            .logo h1{
                font-size: 28px;
            }
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <h1>PickleBowl</h1>

                <p>Admin Panel Login</p>

            </div>

            {% if messages %}

                {% for message in messages %}

                    <div class="error-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="input-group">

                    <label>Mobile Number</label>

                    <input
                        type="text"
                        name="mobile"
                        placeholder="Enter Mobile Number"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>

            <div class="footer">

                © 2026 PickleBowl Admin Panel

            </div>

        </div>

    </div>

    <script>

        // AUTO HIDE ERROR MESSAGE

        setTimeout(() => {

            const error =
            document.querySelector(".error-message");

            if(error){

                error.style.display = "none";
            }

        }, 3000);

    </script>

</body>

</html>
