{% extends 'adminpanel/base.html' %}

{% block title %}
Add Festival
{% endblock %}

{% block active_festivals %}
active
{% endblock %}

{% block content %}

<style>

    .page-header{

        display:flex;

        justify-content:space-between;

        align-items:center;

        margin-bottom:30px;
    }

    .page-header h1{

        font-size:32px;

        color:#0f172a;
    }

    .back-btn{

        text-decoration:none;

        background:#e2e8f0;

        color:#0f172a;

        padding:12px 18px;

        border-radius:10px;

        font-weight:600;

        transition:0.3s;
    }

    .back-btn:hover{

        background:#cbd5e1;
    }

    .form-card{

        background:white;

        padding:35px;

        border-radius:22px;

        box-shadow:0 10px 30px rgba(0,0,0,0.08);

        max-width:750px;
    }

    .form-grid{

        display:grid;

        grid-template-columns:1fr 1fr;

        gap:22px;
    }

    .full-width{

        grid-column:1/3;
    }

    .input-group{

        display:flex;

        flex-direction:column;
    }

    .input-group label{

        margin-bottom:10px;

        color:#334155;

        font-weight:700;
    }

    .input-group input{

        padding:14px;

        border:1px solid #cbd5e1;

        border-radius:12px;

        font-size:15px;

        transition:0.3s;
    }

    .input-group input:focus{

        outline:none;

        border-color:#2563eb;

        box-shadow:0 0 0 4px rgba(37,99,235,0.15);
    }

    .upload-box{

        border:2px dashed #cbd5e1;

        background:#f8fafc;

        padding:25px;

        border-radius:14px;
    }

    .date-box{

        background:#f8fafc;

        padding:18px;

        border-radius:14px;

        border:1px solid #e2e8f0;
    }

    .submit-btn{

        margin-top:30px;

        border:none;

        background:#2563eb;

        color:white;

        padding:15px 30px;

        border-radius:12px;

        font-size:16px;

        font-weight:700;

        cursor:pointer;

        transition:0.3s;
    }

    .submit-btn:hover{

        background:#1d4ed8;

        transform:translateY(-2px);
    }

    @media(max-width:768px){

        .form-grid{

            grid-template-columns:1fr;
        }

        .full-width{

            grid-column:auto;
        }
    }

</style>

<div class="page-header">

    <h1>
        Add Festival
    </h1>

    <a
        href="/admin/festivals/"
        class="back-btn"
    >
        ← Back
    </a>

</div>

<div class="form-card">

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        <div class="form-grid">

            <div class="input-group full-width">

                <label>
                    Festival Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Festival Name"
                    required
                >

            </div>

            <div class="input-group full-width">

                <label>
                    Festival Banner / Image
                </label>

                <div class="upload-box">

                    <input
                        type="file"
                        name="image"
                        required
                    >

                </div>

            </div>

            <div class="input-group">

                <label>
                    Start Date
                </label>

                <div class="date-box">

                    <input
                        type="date"
                        name="start_date"
                        required
                    >

                </div>

            </div>

            <div class="input-group">

                <label>
                    End Date
                </label>

                <div class="date-box">

                    <input
                        type="date"
                        name="end_date"
                        required
                    >

                </div>

            </div>

        </div>

        <button
            type="submit"
            class="submit-btn"
        >
            Add Festival
        </button>

    </form>

</div>

{% endblock %}
